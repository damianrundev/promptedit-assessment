# Added alongside the existing vhosts; certbot --apache adds the :443 vhost and the http->https redirect.
<VirtualHost *:80>
    ServerName __HOST__
    DocumentRoot /var/www/promptedit/public
    <Directory /var/www/promptedit/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    php_admin_flag display_errors Off
    php_admin_value memory_limit 256M
    ErrorLog ${APACHE_LOG_DIR}/promptedit-error.log
    CustomLog ${APACHE_LOG_DIR}/promptedit-access.log combined
</VirtualHost>
