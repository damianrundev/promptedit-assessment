[program:promptedit-worker]
command=/usr/bin/php8.4 /var/www/promptedit/artisan queue:work --sleep=2 --tries=3 --timeout=90 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=100
redirect_stderr=true
stdout_logfile=/var/www/promptedit/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
